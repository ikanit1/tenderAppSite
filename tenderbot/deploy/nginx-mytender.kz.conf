# Nginx: mytender.kz — root site + apisite + tenderbot (вариант A: один домен)
# Разместить: /etc/nginx/sites-available/mytender.kz.conf
# Активация: sudo ln -s /etc/nginx/sites-available/mytender.kz.conf /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d mytender.kz
#
# Пути: ROOT_SITE_PATH — папка dist корневого сайта (npm run build)
#       Например: /var/www/tenderAppSite/dist

# TenderBot (веб-админка + Mini App)
upstream tenderbot_web {
    server 127.0.0.1:8000;
}

# APISite (каталог B2B)
upstream apisite_web {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name mytender.kz www.mytender.kz;

    # Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Каталог
    location = /catalog {
        return 301 /catalog/;
    }
    location /catalog/ {
        proxy_pass http://apisite_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # TenderBot: Mini App, админка (login, dashboard, users, tenders, applications, support, reviews)
    location /miniapp/ {
        proxy_pass http://tenderbot_web/miniapp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(login|logout|dashboard|users|tenders|applications|support|reviews|health|updates|static)(/|$) {
        proxy_pass http://tenderbot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Root site (маркетинг SPA) — изменить ROOT_SITE_PATH под свой путь
    location / {
        root /var/www/tenderAppSite/dist;
        try_files $uri $uri/ /index.html;
    }
}
