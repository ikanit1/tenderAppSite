# Nginx: only static SPA (tenderAppSite) - single root, no proxy.
# Use if the site is served by a separate domain or IP from /var/www/tenderAppSite.
#
# Install:
#   sudo cp .../tenderAppSite-only.conf /etc/nginx/sites-available/tenderAppSite.conf
#   sudo ln -sf /etc/nginx/sites-available/tenderAppSite.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/tenderAppSite;
    index index.html;

    location /projects {
        rewrite ^/projects(/.*)?$ /index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        try_files $uri =404;
    }
}
