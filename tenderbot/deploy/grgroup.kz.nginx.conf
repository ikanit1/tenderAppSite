# Nginx: grgroup.kz → Root site + APISite + TenderBot (один домен)
# Установка: sudo cp /opt/tenderAppSite-main/tenderbot/deploy/grgroup.kz.nginx.conf /etc/nginx/sites-available/grgroup.kz.conf
#           sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d grgroup.kz -d www.grgroup.kz

# TenderBot (веб-админка + Mini App)
upstream tenderbot_web {
    server 127.0.0.1:8000;
}

# APISite (каталог B2B, картинки для SATU)
upstream apisite_web {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name grgroup.kz www.grgroup.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # APISite: API и картинки (для SATU Excel: https://grgroup.kz/api/products/.../image)
    location /api/ {
        proxy_pass http://apisite_web/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /products {
        proxy_pass http://apisite_web/products;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /checkout {
        proxy_pass http://apisite_web/checkout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://apisite_web/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /catalog {
        return 301 /catalog/;
    }

    location /catalog/ {
        proxy_pass http://apisite_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /miniapp/ {
        proxy_pass http://tenderbot_web/miniapp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(login|logout|dashboard|users|tenders|applications|support|reviews|health|updates|static)(/|$) {
        proxy_pass http://tenderbot_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /sitemap.xml {
        proxy_pass http://apisite_web/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: /projects и /projects/* — всегда отдаём index.html (без доступа к каталогу projects на диске → нет 403)
    location /projects {
        rewrite ^/projects(/.*)?$ /index.html last;
    }

    location / {
        root /var/www/tenderAppSite;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name grgroup.kz www.grgroup.kz;

    ssl_certificate     /etc/letsencrypt/live/grgroup.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grgroup.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
